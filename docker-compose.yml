# docker-compose.yml (owner: P4 Backend / DevOps)
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_PATH: /app/models/model.joblib
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      OTP_API_BASE: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy